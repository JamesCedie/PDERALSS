services:
  - type: web
    name: capstoneee
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: WATERMARK_SECRET
        sync: false
      - key: NOMINATIM_EMAIL
        sync: false
